site_name: OmniAgent
site_description: Your AI representative across communication channels
site_url: https://plexusone.github.io/omniagent
repo_url: https://github.com/plexusone/omniagent
repo_name: plexusone/omniagent

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
    - OpenAI-Compatible API: guides/openai-api.md
    - Image Generation: guides/images.md
    - Web UI Authentication: guides/authentication.md
    - Multi-Agent Setup: guides/multi-agent.md
    - Deployment: guides/deployment.md
    - Twilio Setup: guides/twilio.md
    - WhatsApp Setup: guides/whatsapp.md
    - Voice Integration: guides/voice.md
    - LLM Providers: guides/providers.md
    - Skills Development: guides/skills.md
    - Memory Skill: guides/memory.md
    - GitHub Skill: guides/github.md
    - Sessions & Storage: guides/sessions.md
    - Scheduled Jobs: guides/cron.md
    - Context Management: guides/context.md
    - Event Hooks: guides/hooks.md
    - Sandboxing: guides/sandboxing.md
    - Agent Profiles: guides/profiles.md
    - Access Policies: guides/policies.md
    - Browser Automation: guides/browser.md
    - Vault Credentials: guides/vault-credentials.md
    - Web Content Skill: guides/web.md
    - Auto-Reply: guides/autoreply.md
  - Architecture:
    - Overview: architecture/overview.md
    - Skills System: architecture/skills.md
  - Roadmap:
    - Feature Parity: specs/PARITY-ROADMAP.md
    - Control UI: specs/ROADMAP.md
  - Reference:
    - Configuration: reference/configuration.md
    - CLI Commands: reference/cli.md
    - Environment Variables: reference/environment.md
  - Design:
    - Voice Notes:
      - Specification: design/voice_notes/SPEC.md
      - Case Study: design/voice_notes/CASE_STUDY.md
  - Releases:
    - v0.12.0: releases/v0.12.0.md
    - v0.11.0: releases/v0.11.0.md
    - v0.10.0: releases/v0.10.0.md
    - v0.9.0: releases/v0.9.0.md
    - v0.8.0: releases/v0.8.0.md
    - v0.7.0: releases/v0.7.0.md
    - v0.6.0:
      - Release Notes: releases/v0.6.0/index.md
      - Plan: releases/v0.6.0/PLAN.md
      - Tasks: releases/v0.6.0/TASKS.md
    - v0.5.0: releases/v0.5.0.md
    - v0.4.0: releases/v0.4.0.md
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md

extra:
